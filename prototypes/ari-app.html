   TARİH YARDIMCILARI
   Not: new Date("2025-05-02") UTC olarak okunur ve negatif saat
   dilimlerinde bir gün geriye kayar. Bu yüzden her yerde
   yerel saate göre kuran/okuyan yardımcıları kullanıyoruz.
───────────────────────────────────────── */
const pad2 = n => String(n).padStart(2, "0");
const dateKey = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const startOfToday = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

const MONTHS_TR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const MONTHS_TR_SHORT = ["OCA","ŞUB","MAR","NİS","MAY","HAZ","TEM","AĞU","EYL","EKI","KAS","ARA"];

const fmtLongDate = key => { const d = parseKey(key); return `${d.getDate()} ${MONTHS_TR[d.getMonth()]}`; };

/* Göreli zaman: "Az önce" · "12 dk önce" · "3 sa önce" · "8 Mayıs" */
const relTime = iso => {
  if (!iso) return "";
  const t = new Date(iso);
  if (isNaN(t)) return String(iso);
  const diff = (Date.now() - t.getTime()) / 1000;
  if (diff < 60)     return "Az önce";
  if (diff < 3600)   return `${Math.floor(diff / 60)} dk önce`;
  if (diff < 86400)  return `${Math.floor(diff / 3600)} sa önce`;
  if (diff < 172800) return "Dün";
  return `${t.getDate()} ${MONTHS_TR[t.getMonth()]}`;
};

/* ─────────────────────────────────────────
   KALICI DEPOLAMA
   Prototipte veri sunucuda tutulmuyor; tarayıcıda saklıyoruz ki
   sekme değiştirince / sayfa yenilenince yapılan işler kaybolmasın.
───────────────────────────────────────── */
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem("ari:" + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("ari:" + key, JSON.stringify(value)); } catch { /* özel mod / kota */ }
  },
};

function usePersisted(key, initial) {
  const [value, setValue] = useState(() => store.get(key, initial));
  useEffect(() => { store.set(key, value); }, [key, value]);
  return [value, setValue];
}

/* ─────────────────────────────────────────
   PIN PAD
   Eski sürümde onComplete, setPin güncelleyicisinin *içinden*
   çağrılıyordu — güncelleyiciler saf olmalı ve React bunları iki kez
   çalıştırabilir. Artık yan etki useEffect'te.
───────────────────────────────────────── */
function PinPad({ onSubmit, accent = T.Y }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState(false);

  const press = useCallback(d => setPin(p => (p.length >= 4 ? p : p + d)), []);
  const del = useCallback(() => setPin(p => p.slice(0, -1)), []);

  /* 4 hane tamamlanınca doğrula */
  useEffect(() => {
    if (pin.length !== 4) return;
    const t = setTimeout(() => {
      if (onSubmit(pin)) return;          // doğruysa üst bileşen ekranı değiştirir
      setErr(true);
      setPin("");
      setTimeout(() => setErr(false), 420);
    }, 130);
    return () => clearTimeout(t);
  }, [pin, onSubmit]);

  /* Masaüstünde klavyeyle de girilebilsin */
  useEffect(() => {
    const onKey = e => {
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === "Backspace") del();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [press, del]);

  const KEYS = [1,2,3,4,5,6,7,8,9,null,0,"del"];

  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
      <div style={{ display:"flex", gap:16, marginBottom:40, animation: err ? "shake .35s" : "none" }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{
            width:12, height:12, borderRadius:"50%",
            background: i < pin.length ? (err ? T.R : accent) : T.bg3,
            transition:"background .12s, transform .12s",
            transform: i < pin.length ? "scale(1.1)" : "scale(1)",
          }}/>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, width:"min(72vw, 260px)" }}>
        {KEYS.map((k, i) => {
          if (k === null) return <div key={i}/>;
          const isDel = k === "del";
          return (
            <button key={i}
              onClick={() => (isDel ? del() : press(String(k)))}
              aria-label={isDel ? "Sil" : String(k)}
              style={{
                background: T.bg2, border:"none", borderRadius:12,
                height:"clamp(54px,14vw,64px)",
                fontSize: isDel ? 18 : "clamp(20px,5vw,24px)",
                fontWeight: isDel ? 400 : 300,
                color: T.L1, cursor:"pointer", fontFamily: SF,
                transition:"background .1s", WebkitTapHighlightColor:"transparent",
              }}
              onTouchStart={e => (e.currentTarget.style.background = T.bg3)}
              onTouchEnd={e => (e.currentTarget.style.background = T.bg2)}
            >
              {isDel ? "⌫" : k}
            </button>
          );
        })}
      </div>
    </div>
  );
}

const DAY_H = ["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];

function CalendarView({ user, onPick }) {
  const today = useMemo(startOfToday, []);
  const [cursor, setCursor] = useState(() => ({ y: today.getFullYear(), m: today.getMonth() }));
  const [dayKey, setDayKey] = useState(null);

  const visible = useMemo(
    () => EVENTS.filter(e => user.role === "patron" || e.crew.includes(user.id)),
    [user.role, user.id]
  );

  const byDay = useMemo(() => {
    const map = new Map();
    visible.forEach(e => { if (!map.has(e.date)) map.set(e.date, []); map.get(e.date).push(e); });
    return map;
  }, [visible]);

  const upcoming = useMemo(
    () => visible.filter(e => parseKey(e.date) >= today).slice(0, 6),
    [visible, today]
  );

  const { y, m } = cursor;
  const dim = daysInMonth(y, m);
  const offset = (() => { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; })();
  const shift = n => setCursor(c => { const d = new Date(c.y, c.m + n, 1); return { y:d.getFullYear(), m:d.getMonth() }; });

  const navBtn = {
    background:T.bg1, border:"none", color:T.Y, width:32, height:32, borderRadius:8,
    fontSize:15, cursor:"pointer", fontFamily:SF, display:"flex", alignItems:"center", justifyContent:"center",
  };

  const dayEvents = dayKey ? (byDay.get(dayKey) || []) : [];

  return (
    <div style={{ paddingBottom:100 }}>
      <PageTitle>Takvim</PageTitle>

      {/* Ay gezinme — eskiden takvim Mayıs 2025'e sabitti */}
      <div data-noswipe="1" style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"0 16px 12px" }}>
        <button onClick={() => shift(-1)} style={navBtn} aria-label="Önceki ay">‹</button>
        <span style={{ fontSize:16, fontWeight:600, color:T.L1, fontFamily:SF }}>{MONTHS_TR[m]} {y}</span>
        <button onClick={() => shift(1)} style={navBtn} aria-label="Sonraki ay">›</button>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", padding:"0 12px", marginBottom:4 }}>
        {DAY_H.map((d, i) => (
          <div key={d} style={{ textAlign:"center", fontSize:11, fontWeight:600, color:i >= 5 ? T.R : T.L3, padding:"2px 0", fontFamily:SF }}>
            {d}
          </div>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2, padding:"0 12px" }}>
        {Array(offset).fill(null).map((_, i) => <div key={`pad${i}`}/>)}
        {Array(dim).fill(null).map((_, i) => {
          const day = i + 1;
          const key = dateKey(y, m, day);
          const evs = byDay.get(key) || [];
          const isToday = key === dateKey(today.getFullYear(), today.getMonth(), today.getDate());
          const isWe = (i + offset) % 7 >= 5;
          return (
            <div key={day}
              onClick={() => evs.length && setDayKey(key)}
              style={{
                aspectRatio:"1/1.15", background:T.bg1, borderRadius:8, padding:"4px 3px",
                overflow:"hidden", border:isToday ? `1px solid rgba(255,229,0,0.4)` : "1px solid transparent",
                position:"relative", cursor:evs.length ? "pointer" : "default",
              }}>
              <div style={{ fontSize:10, fontWeight:isToday ? 700 : 400, color:isToday ? T.Y : isWe ? "#666" : T.L3, textAlign:"right", marginBottom:2, fontFamily:SF, lineHeight:1 }}>{day}</div>
              {evs.slice(0, 2).map(ev => (
                <div key={ev.id}
                  style={{ fontSize:7, lineHeight:1.3, color:T.L2, background:"rgba(255,229,0,0.08)", borderLeft:`1.5px solid rgba(255,229,0,0.5)`, borderRadius:"0 2px 2px 0", padding:"1px 3px", marginBottom:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", fontFamily:SF }}>
                  {ev.name}
                </div>
              ))}
              {evs.length > 2 && <div style={{ fontSize:7, color:T.L4, textAlign:"center", fontFamily:SF }}>+{evs.length - 2}</div>}
            </div>
          );
        })}
      </div>

      <SectionHeader>Yaklaşan</SectionHeader>
      <div style={{ padding:"0 16px" }}>
        {upcoming.length === 0 ? (
          <Cell first last><span style={{ fontSize:14, color:T.L4 }}>Yaklaşan etkinlik yok</span></Cell>
        ) : (
          <div style={{ borderRadius:12, overflow:"hidden" }}>
            {upcoming.map((ev, i, arr) => (
              <EventRow key={ev.id} ev={ev} first={i === 0} last={i === arr.length - 1} onPick={onPick}/>
            ))}
          </div>
        )}
      </div>

      {/* Gün detayı — bir güne sığmayan etkinlikler artık ulaşılabilir */}
      {dayKey && (
        <Sheet title={fmtLongDate(dayKey)} subtitle={`${dayEvents.length} etkinlik`} onClose={() => setDayKey(null)} maxHeight="70dvh">
          <div style={{ padding:"0 16px 16px" }}>
            <div style={{ borderRadius:12, overflow:"hidden" }}>
              {dayEvents.map((ev, i, arr) => (
                <EventRow key={ev.id} ev={ev} first={i === 0} last={i === arr.length - 1}
                  onPick={e => { setDayKey(null); onPick(e); }}/>
              ))}
            </div>
          </div>
        </Sheet>
      )}
    </div>
  );
}

function EventRow({ ev, first, last, onPick }) {
  const d = parseKey(ev.date);
  return (
    <Cell first={first} last={last} onClick={() => onPick(ev)}>
      <div style={{ width:36, height:36, borderRadius:9, background:T.Yd, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
        <span style={{ fontSize:9, color:T.Y, fontWeight:700, fontFamily:SF }}>{MONTHS_TR_SHORT[d.getMonth()]}</span>
        <span style={{ fontSize:14, color:T.Y, fontWeight:700, fontFamily:SF, lineHeight:1 }}>{d.getDate()}</span>
      </div>
      <div style={{ flex:1, minWidth:0 }}>
        <p style={{ margin:0, fontSize:15, fontWeight:500, color:T.L1, fontFamily:SF, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{ev.name}</p>
        <p style={{ margin:0, fontSize:12, color:T.L3, fontFamily:SF }}>
          {ev.client}
          {ev.meetTime && <span style={{ color:T.L4 }}> · buluşma <span style={{ fontFamily:MONO }}>{ev.meetTime}</span></span>}
          <span style={{ color:T.Y, fontFamily:MONO }}> · {ev.time}</span>
        </p>
      </div>
      <Chevron/>
    </Cell>
  );
}

/* ─────────────────────────────────────────
   ETKİNLİK DETAY
   Rider tikleri ve notlar artık üst seviyede tutuluyor; geri gidip
   dönünce (ve sayfa yenilenince) kaybolmuyor.
───────────────────────────────────────── */
function EventDetail({ ev, user, state, onChange, onBack }) {
  const [input, setInput] = useState("");
  const checkedIds = state?.checked || [];
  const notes = state?.notes || [];

  const toggle = id => onChange({
    ...state,
    checked: checkedIds.includes(id) ? checkedIds.filter(x => x !== id) : [...checkedIds, id],
  });

  const addNote = () => {
    const text = input.trim();
    if (!text) return;
    onChange({ ...state, notes:[...notes, { text, by:user.name, at:new Date().toISOString() }] });
    setInput("");
  };

  const checked = ev.rider.filter(r => checkedIds.includes(r.id)).length;
  const pct = ev.rider.length ? checked / ev.rider.length : 0;
  const allDone = ev.rider.length > 0 && checked === ev.rider.length;

  const seeded = ev.notes.map(text => ({ text, by:"Levent", at:null, seeded:true }));
  const allNotes = [...seeded, ...notes];

  return (
    <div style={{ fontFamily:SF, minHeight:"100dvh", background:T.bg0, paddingBottom:60 }}>

      <div style={{ padding:"12px 16px 0" }}>
        <button onClick={onBack} style={{ background:"none", border:"none", color:T.Y, fontSize:15, cursor:"pointer", padding:0, fontFamily:SF }}>‹ Takvim</button>
      </div>

      {/* Başlık */}
      <div style={{ padding:"14px 20px 16px" }}>
        <p style={{ margin:"0 0 3px", fontSize:13, color:T.L3 }}>{ev.client}  ·  {fmtLongDate(ev.date)}</p>
        <h1 style={{ margin:"0 0 6px", fontSize:"clamp(24px,7vw,30px)", fontWeight:700, letterSpacing:-0.5, color:T.L1 }}>{ev.name}</h1>
        <p style={{ margin:"0 0 3px", fontSize:14, color:T.L2 }}>📍 {ev.venue}</p>
        <p style={{ margin:"0 0 12px", fontSize:13, color:T.L3 }}>{ev.crew.map(uName).join("  ·  ")}</p>
        <div style={{ display:"flex", alignItems:"flex-end", gap:20 }}>
          {ev.meetTime && (
            <div>
              <p style={{ margin:"0 0 3px", fontSize:11, color:T.L4, letterSpacing:0.3 }}>BULUŞMA</p>
              <span style={{ fontSize:28, fontWeight:300, color:T.L2, fontFamily:MONO }}>{ev.meetTime}</span>
            </div>
          )}
          <div>
            <p style={{ margin:"0 0 3px", fontSize:11, color:T.L4, letterSpacing:0.3 }}>ETKİNLİK</p>
            <span style={{ fontSize:28, fontWeight:300, color:T.Y, fontFamily:MONO }}>{ev.time}</span>
          </div>
        </div>
      </div>

      {/* İlerleme */}
      <div style={{ padding:"0 20px 20px" }}>
        <div style={{ height:2, background:T.bg2, borderRadius:1 }}>
          <div style={{ height:"100%", width:`${pct * 100}%`, background:allDone ? T.G : T.Y, borderRadius:1, transition:"width .3s ease" }}/>
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", marginTop:7 }}>
          <span style={{ fontSize:12, color:T.L3 }}>Rider</span>
          <span style={{ fontSize:12, color:allDone ? T.G : T.L3, fontFamily:MONO, transition:"color .3s" }}>{checked}/{ev.rider.length}</span>
        </div>
      </div>

      {/* Rider listesi */}
      <div style={{ padding:"0 16px" }}>
        <div style={{ borderRadius:14, overflow:"hidden", display:"flex", flexDirection:"column", gap:2 }}>
          {ev.rider.map(item => {
            const on = checkedIds.includes(item.id);
            return (
              <div key={item.id} onClick={() => toggle(item.id)}
                style={{
                  background: on ? T.Yd : T.bg1, padding:"16px",
                  display:"flex", alignItems:"center", gap:14,
                  cursor:"pointer", transition:"background .15s", WebkitTapHighlightColor:"transparent",
                }}>
                <div style={{
                  width:24, height:24, borderRadius:"50%",
                  border:`1.5px solid ${on ? T.Y : T.bg3}`, background: on ? T.Y : "transparent",
                  display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"all .15s",
                }}>
                  {on && (
                    <svg width="12" height="9" viewBox="0 0 12 9" fill="none">
                      <path d="M1 4l3.5 3.5L11 1" stroke="#000" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  )}
                </div>
                <span style={{ flex:1, fontSize:16, color:on ? T.L3 : T.L1, textDecoration:on ? "line-through" : "none", transition:"color .15s" }}>
                  {item.name}
                </span>
                <span style={{ fontSize:16, fontWeight:600, color:on ? T.L4 : T.Y, fontFamily:MONO, transition:"color .15s" }}>
                  {item.qty} <span style={{ fontSize:11, fontWeight:400, color:T.L4 }}>{item.u}</span>
                </span>
              </div>
            );
          })}
        </div>

        {allDone && (
          <div style={{ background:T.Gd, borderRadius:14, padding:"18px 20px", textAlign:"center", marginTop:10 }}>
            <p style={{ margin:0, fontSize:17, fontWeight:600, color:T.G }}>Tümü hazır ✓</p>
          </div>
        )}
      </div>

      {/* Notlar */}
      <div style={{ padding:"24px 16px 0" }}>
        <SectionHeader>Notlar</SectionHeader>
        <div style={{ borderRadius:12, overflow:"hidden", marginBottom:10 }}>
          {allNotes.length === 0 && (
            <Cell first last><span style={{ fontSize:14, color:T.L4 }}>Henüz not yok</span></Cell>
          )}
          {allNotes.map((n, i, arr) => (
            <Cell key={i} first={i === 0} last={i === arr.length - 1}>
              <div>
                <p style={{ margin:"0 0 3px", fontSize:14, color:T.L1 }}>{n.text}</p>
                <p style={{ margin:0, fontSize:11, color:T.L4 }}>{n.by}  ·  {n.seeded ? "Önceden" : relTime(n.at)}</p>
              </div>
            </Cell>
          ))}
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <input value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") addNote(); }}
            placeholder="Not ekle…" enterKeyHint="done"
            style={{ flex:1, background:T.bg1, border:"none", outline:"none", borderRadius:10, padding:"12px 14px", fontSize:15, color:T.L1, fontFamily:SF }}/>
          <button onClick={addNote} aria-label="Not ekle"
            style={{ background:T.Y, border:"none", borderRadius:10, width:44, fontSize:22, cursor:"pointer", flexShrink:0 }}>+</button>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   GÖREVLER
───────────────────────────────────────── */
function TasksView({ user }) {
  const [tasks, setTasks] = usePersisted("tasks", TASKS_INIT);
  const [adding, setAdding] = useState(false);
  const [newT, setNewT] = useState({ title:"", desc:"" });

  /* Tamamlanan görev geri alınabiliyor — eskiden tek yönlüydü */
  const toggle = id => setTasks(p => p.map(t => t.id === id
    ? { ...t, done:!t.done, doneBy:!t.done ? user.id : null, doneAt:!t.done ? new Date().toISOString() : null }
    : t));

  const add = () => {
    const title = newT.title.trim();
    if (!title) return;
    setTasks(p => [...p, { id:genId(), title, desc:newT.desc.trim(), done:false, doneBy:null, doneAt:null }]);
    setNewT({ title:"", desc:"" });
    setAdding(false);
  };

  const remove = id => setTasks(p => p.filter(t => t.id !== id));

  const active = tasks.filter(t => !t.done);
  const done = tasks.filter(t => t.done);

  return (
    <div style={{ paddingBottom:100, fontFamily:SF }}>
      <PageTitle right={user.role === "patron" && (
        <button onClick={() => setAdding(a => !a)}
          style={{ background:"none", border:"none", color:T.Y, fontSize:15, cursor:"pointer", fontFamily:SF, paddingBottom:4 }}>
          {adding ? "İptal" : "+ Ekle"}
        </button>
      )}>Görevler</PageTitle>

      {adding && (
        <div style={{ margin:"0 16px 16px", background:T.bg1, borderRadius:12, padding:16 }}>
          <input value={newT.title} onChange={e => setNewT(p => ({ ...p, title:e.target.value }))}
            placeholder="Görev başlığı" autoFocus
            onKeyDown={e => { if (e.key === "Enter") add(); }}
            style={{ width:"100%", background:T.bg2, border:"none", outline:"none", borderRadius:8, padding:"10px 12px", fontSize:15, color:T.L1, fontFamily:SF, marginBottom:8 }}/>
          <input value={newT.desc} onChange={e => setNewT(p => ({ ...p, desc:e.target.value }))}
            placeholder="Açıklama (opsiyonel)"
            onKeyDown={e => { if (e.key === "Enter") add(); }}
            style={{ width:"100%", background:T.bg2, border:"none", outline:"none", borderRadius:8, padding:"10px 12px", fontSize:14, color:T.L2, fontFamily:SF, marginBottom:12 }}/>
          <button onClick={add}
            style={{ width:"100%", background:T.Y, border:"none", borderRadius:10, padding:"12px 0", fontSize:15, fontWeight:600, color:"#000", cursor:"pointer", fontFamily:SF }}>
            Oluştur
          </button>
        </div>
      )}

      {tasks.length === 0 && <Empty>Görev yok</Empty>}

      {active.length > 0 && (
        <div style={{ padding:"0 16px" }}>
          <div style={{ borderRadius:12, overflow:"hidden" }}>
            {active.map((t, i, arr) => (
              <Cell key={t.id} first={i === 0} last={i === arr.length - 1} onClick={() => toggle(t.id)}>
                <div style={{ width:22, height:22, borderRadius:"50%", border:`1.5px solid ${T.bg3}`, flexShrink:0 }}/>
                <div style={{ flex:1, minWidth:0 }}>
                  <p style={{ margin:0, fontSize:15, color:T.L1 }}>{t.title}</p>
                  {t.desc && <p style={{ margin:"2px 0 0", fontSize:13, color:T.L3 }}>{t.desc}</p>}
                </div>
                {user.role === "patron" && (
                  <button onClick={e => { e.stopPropagation(); remove(t.id); }} aria-label="Görevi sil"
                    style={{ background:"none", border:"none", color:T.L4, fontSize:15, cursor:"pointer", padding:"0 2px", flexShrink:0 }}>✕</button>
                )}
              </Cell>
            ))}
          </div>
        </div>
      )}

      {done.length > 0 && (
        <div style={{ padding:"0 16px" }}>
          <SectionHeader>Tamamlandı</SectionHeader>
          <div style={{ borderRadius:12, overflow:"hidden" }}>
            {done.map((t, i, arr) => (
              <Cell key={t.id} first={i === 0} last={i === arr.length - 1} onClick={() => toggle(t.id)} style={{ opacity:0.5 }}>
                <div style={{ width:22, height:22, borderRadius:"50%", background:T.G, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                  <svg width="11" height="8" viewBox="0 0 11 8"><path d="M1 3.5l3 3L10 1" stroke="#000" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" fill="none"/></svg>
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <p style={{ margin:0, fontSize:15, color:T.L3, textDecoration:"line-through" }}>{t.title}</p>
                  {user.role === "patron" && t.doneBy && (
                    <p style={{ margin:"2px 0 0", fontSize:12, color:T.L4 }}>{uName(t.doneBy)}  ·  {relTime(t.doneAt)}</p>
                  )}
                </div>
              </Cell>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

   ENVANTER
───────────────────────────────────────── */
function AddProductSheet({ cats, onSave, onClose }) {
  const [form, setForm] = useState({ name:"", cat:cats[0] || "", total:"1", perCase:"1" });
  const [accs, setAccs] = useState([]);
  const [newCat, setNewCat] = useState("");
  const [addingCat, setAddingCat] = useState(false);
  const [localCats, setLocalCats] = useState(cats);
  const [err, setErr] = useState("");

  const addAcc = () => setAccs(p => [...p, { id:genId(), name:"", perUnit:1 }]);
  const updAcc = (id, k, v) => setAccs(p => p.map(a => (a.id === id ? { ...a, [k]:v } : a)));
  const delAcc = id => setAccs(p => p.filter(a => a.id !== id));

  const total = Math.max(0, parseInt(form.total, 10) || 0);
  const perCase = Math.max(1, parseInt(form.perCase, 10) || 1);

  const save = () => {
    if (!form.name.trim()) { setErr("Ürün adı gerekli."); return; }
    if (total < 1) { setErr("Toplam adet en az 1 olmalı."); return; }
    onSave({
      id:genId(), name:form.name.trim(), cat:form.cat || "Diğer",
      total, out:0, perCase, faults:0, notes:[], addedBy:"Ekip",
      accessories:accs.filter(a => a.name.trim()).map(a => ({ ...a, name:a.name.trim() })),
    });
  };

  const iStyle = { width:"100%", background:T.bg2, border:"none", outline:"none", borderRadius:10, padding:"11px 14px", fontSize:15, color:T.L1, fontFamily:SF };

  return (
    <Sheet title="Ürün Ekle" onClose={onClose} maxHeight="92dvh" dismissOnBackdrop={false}>
      <div style={{ padding:"0 16px", display:"flex", flexDirection:"column", gap:14 }}>

        <div>
          <p style={{ margin:"0 0 6px 4px", fontSize:12, color:T.L3, fontFamily:SF }}>ÜRÜN ADI</p>
          <input value={form.name} onChange={e => { setErr(""); setForm(p => ({ ...p, name:e.target.value })); }}
            placeholder="örn. Pixel LED" autoFocus style={iStyle}/>
        </div>

        <div>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
            <p style={{ margin:0, fontSize:12, color:T.L3, fontFamily:SF }}>KATEGORİ</p>
            <button onClick={() => setAddingCat(a => !a)} style={{ background:"none", border:"none", color:T.Y, fontSize:12, cursor:"pointer", fontFamily:SF }}>+ Yeni</button>
          </div>
          {addingCat && (
            <div style={{ display:"flex", gap:8, marginBottom:10 }}>
              <input value={newCat} onChange={e => setNewCat(e.target.value)} placeholder="Kategori adı" style={{ ...iStyle, flex:1 }}/>
              <button onClick={() => {
                  const c = newCat.trim();
                  if (!c) return;
                  setLocalCats(p => (p.includes(c) ? p : [...p, c]));
                  setForm(f => ({ ...f, cat:c }));
                  setNewCat(""); setAddingCat(false);
                }}
                style={{ background:T.Y, border:"none", borderRadius:10, padding:"0 16px", color:"#000", fontWeight:700, cursor:"pointer", fontFamily:SF, fontSize:14, flexShrink:0 }}>Ekle</button>
            </div>
          )}
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
            {localCats.map(c => (
              <button key={c} onClick={() => setForm(p => ({ ...p, cat:c }))}
                style={{ background:form.cat === c ? T.Yd : T.bg2, border:`1px solid ${form.cat === c ? T.Y + "55" : "transparent"}`, borderRadius:20, padding:"7px 14px", fontSize:14, color:form.cat === c ? T.Y : T.L2, cursor:"pointer", fontFamily:SF, transition:"all .15s" }}>
                {c}
              </button>
            ))}
          </div>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
          <div>
            <p style={{ margin:"0 0 6px 4px", fontSize:12, color:T.L3, fontFamily:SF }}>TOPLAM ADET</p>
            <input type="number" inputMode="numeric" min="1" value={form.total}
              onChange={e => { setErr(""); setForm(p => ({ ...p, total:e.target.value })); }} style={iStyle}/>
          </div>
          <div>
            <p style={{ margin:"0 0 6px 4px", fontSize:12, color:T.L3, fontFamily:SF }}>CASE KAPASİTESİ</p>
            <input type="number" inputMode="numeric" min="1" value={form.perCase}
              onChange={e => setForm(p => ({ ...p, perCase:e.target.value }))} style={iStyle}/>
          </div>
        </div>

        {total > 0 && (
          <div style={{ background:T.Yd, borderRadius:10, padding:"10px 14px", display:"flex", justifyContent:"space-between" }}>
            <span style={{ fontSize:13, color:T.Y, fontFamily:SF }}>{total} adet ÷ {perCase}/case</span>
            <span style={{ fontSize:15, fontWeight:700, color:T.Y, fontFamily:SF }}>{Math.ceil(total / perCase)} case</span>
          </div>
        )}

        <div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
            <p style={{ margin:0, fontSize:12, color:T.L3, fontFamily:SF }}>BİRLİKTE GELEN AKSESUARLAR</p>
            <button onClick={addAcc} style={{ background:"none", border:"none", color:T.Y, fontSize:12, cursor:"pointer", fontFamily:SF }}>+ Ekle</button>
          </div>
          {accs.length === 0 && <p style={{ fontSize:13, color:T.L4, fontFamily:SF, margin:0 }}>Her üniteyle birlikte gelen kablo, adaptör vs.</p>}
          {accs.map(a => (
            <div key={a.id} style={{ display:"flex", gap:8, marginBottom:8, alignItems:"center" }}>
              <input value={a.name} onChange={e => updAcc(a.id, "name", e.target.value)} placeholder="örn. Data Kablo" style={{ ...iStyle, flex:1 }}/>
              <div style={{ display:"flex", alignItems:"center", gap:4, background:T.bg2, borderRadius:10, padding:"0 10px", height:44, flexShrink:0 }}>
                <button onClick={() => updAcc(a.id, "perUnit", Math.max(1, a.perUnit - 1))} aria-label="Azalt"
                  style={{ background:"none", border:"none", color:T.L2, fontSize:18, cursor:"pointer" }}>−</button>
                <span style={{ fontSize:14, color:T.L1, fontFamily:MONO, minWidth:16, textAlign:"center" }}>{a.perUnit}</span>
                <button onClick={() => updAcc(a.id, "perUnit", a.perUnit + 1)} aria-label="Artır"
                  style={{ background:"none", border:"none", color:T.L2, fontSize:18, cursor:"pointer" }}>+</button>
              </div>
              <button onClick={() => delAcc(a.id)} aria-label="Aksesuarı sil"
                style={{ background:"none", border:"none", color:T.R, fontSize:18, cursor:"pointer" }}>✕</button>
            </div>
          ))}
        </div>

        {err && <p style={{ margin:0, fontSize:13, color:T.R, fontFamily:SF }}>{err}</p>}

        <button onClick={save}
          style={{ background:T.Y, border:"none", borderRadius:12, padding:"15px 0", fontSize:16, fontWeight:600, color:"#000", cursor:"pointer", fontFamily:SF, marginBottom:8 }}>
          Kaydet
        </button>
      </div>
    </Sheet>
  );
}

function ProductDetail({ item, user, onClose, onUpdate, onDelete }) {
  const [noteInput, setNoteInput] = useState("");
  const [amount, setAmount] = useState("1");
  const [mode, setMode] = useState(null); // "add" | "deduct"

  const available = Math.max(0, item.total - item.out);
  const cases = Math.ceil(item.total / item.perCase) || 0;
  const availCases = Math.floor(available / item.perCase);

  const addNote = () => {
    const t = noteInput.trim();
    if (!t) return;
    onUpdate({ ...item, notes:[...item.notes, t] });
    setNoteInput("");
  };

  /* Stok düşerken out/faults toplamı aşmasın — eskiden müsait
     adet eksiye düşebiliyordu. */
  const applyStock = () => {
    const n = Math.max(0, parseInt(amount, 10) || 0);
    if (n > 0) {
      const total = mode === "add" ? item.total + n : Math.max(0, item.total - n);
      onUpdate({ ...item, total, out:Math.min(item.out, total), faults:Math.min(item.faults, total) });
    }
    setMode(null); setAmount("1");
  };

  const setFaults = n => onUpdate({ ...item, faults:Math.min(Math.max(0, n), item.total) });

  const outlineBtn = {
    flex:1, background:"transparent", border:`1px solid ${T.R}55`, borderRadius:10,
    padding:"11px 0", fontSize:14, fontWeight:600, color:T.R, cursor:"pointer", fontFamily:SF,
  };

  return (
    <Sheet title={item.name} subtitle={item.cat} meta={item.id} onClose={onClose} maxHeight="88dvh">
      <div style={{ padding:"0 16px", display:"flex", flexDirection:"column", gap:10 }}>

        {/* Stok */}
        <div style={{ background:T.bg2, borderRadius:14, padding:"16px" }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, textAlign:"center" }}>
            {[["Toplam", item.total, T.L1], ["Müsait", available, available > 0 ? T.G : T.R], ["Dışarıda", item.out, T.Y]].map(([l, v, c]) => (
              <div key={l}>
                <p style={{ margin:0, fontSize:28, fontWeight:700, color:c, fontFamily:MONO, lineHeight:1 }}>{v}</p>
                <p style={{ margin:"5px 0 0", fontSize:11, color:T.L3, fontFamily:SF }}>{l}</p>
              </div>
            ))}
          </div>
          {item.faults > 0 && (
            <div style={{ marginTop:12, padding:"7px 10px", background:T.Rd, borderRadius:8, fontSize:12, color:T.R, fontFamily:SF }}>
              ⚠ {item.faults} adet arızalı
            </div>
          )}
        </div>

        {/* Case */}
        <div style={{ background:T.bg2, borderRadius:14, padding:"14px 16px" }}>
          <p style={{ margin:"0 0 12px", fontSize:12, color:T.L3, fontFamily:SF }}>CASE  ·  {item.perCase} adet/case</p>
          {cases === 0 ? (
            <p style={{ margin:0, fontSize:13, color:T.L4, fontFamily:SF }}>Stok yok</p>
          ) : (
            <>
              <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                {Array(cases).fill(null).map((_, i) => (
                  <div key={i} style={{ width:38, height:38, borderRadius:9, background:i < availCases ? T.Yd : T.Rd, border:`1px solid ${i < availCases ? T.Y + "44" : T.R + "44"}`, display:"flex", alignItems:"center", justifyContent:"center" }}>
                    <span style={{ fontSize:10, fontWeight:700, color:i < availCases ? T.Y : T.R, fontFamily:MONO }}>C{i + 1}</span>
                  </div>
                ))}
              </div>
              <p style={{ margin:"10px 0 0", fontSize:13, color:T.L3, fontFamily:SF }}>
                <span style={{ color:T.Y, fontWeight:600 }}>{availCases}/{cases}</span> case müsait
              </p>
            </>
          )}
        </div>

        {/* Aksesuarlar */}
        {item.accessories.length > 0 && (
          <div style={{ background:T.bg2, borderRadius:14, padding:"14px 16px" }}>
            <p style={{ margin:"0 0 12px", fontSize:12, color:T.L3, fontFamily:SF }}>AKSESUARLAR</p>
            {item.accessories.map(a => (
              <div key={a.id} style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                <div>
                  <span style={{ fontSize:15, color:T.L1, fontFamily:SF }}>{a.name}</span>
                  <span style={{ fontSize:12, color:T.L4, fontFamily:SF, marginLeft:6 }}>{a.perUnit}×/ünite</span>
                </div>
                <span style={{ fontSize:15, fontWeight:600, color:T.L1, fontFamily:MONO }}>
                  {a.perUnit * available}<span style={{ fontSize:11, color:T.L4 }}>/{a.perUnit * item.total}</span>
                </span>
              </div>
            ))}
          </div>
        )}

        {/* Notlar */}
        <div style={{ background:T.bg2, borderRadius:14, padding:"14px 16px" }}>
          <p style={{ margin:"0 0 10px", fontSize:12, color:T.L3, fontFamily:SF }}>NOTLAR</p>
          {item.notes.length === 0 && <p style={{ margin:"0 0 10px", fontSize:13, color:T.L4, fontFamily:SF }}>Henüz not yok</p>}
          {item.notes.map((n, i) => <p key={i} style={{ margin:"0 0 6px", fontSize:14, color:T.L2, fontFamily:SF }}>{n}</p>)}
          <div style={{ display:"flex", gap:8, marginTop:8 }}>
            <input value={noteInput} onChange={e => setNoteInput(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") addNote(); }}
              placeholder="Not ekle…" enterKeyHint="done"
              style={{ flex:1, background:T.bg3, border:"none", outline:"none", borderRadius:8, padding:"9px 12px", fontSize:14, color:T.L1, fontFamily:SF }}/>
            <button onClick={addNote} aria-label="Not ekle"
              style={{ background:T.Y, border:"none", borderRadius:8, padding:"0 14px", color:"#000", fontSize:18, cursor:"pointer" }}>+</button>
          </div>
        </div>

        {/* Sadece yönetici */}
        {user.role === "patron" && (
          <div style={{ background:T.Rd, borderRadius:14, padding:"14px 16px", marginBottom:8 }}>
            <p style={{ margin:"0 0 10px", fontSize:12, color:T.R, fontFamily:SF }}>STOK İŞLEMLERİ  ·  Yönetici</p>

            {!mode ? (
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={() => setMode("add")} style={outlineBtn}>Stok Ekle</button>
                  <button onClick={() => setMode("deduct")} style={outlineBtn}>Stoktan Düş</button>
                </div>
                <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                  <span style={{ flex:1, fontSize:13, color:T.L3, fontFamily:SF }}>Arızalı adet</span>
                  <div style={{ display:"flex", alignItems:"center", gap:10, background:"rgba(0,0,0,0.35)", borderRadius:10, padding:"4px 12px" }}>
                    <button onClick={() => setFaults(item.faults - 1)} aria-label="Arıza azalt"
                      style={{ background:"none", border:"none", color:T.R, fontSize:18, cursor:"pointer" }}>−</button>
                    <span style={{ fontSize:15, color:T.L1, fontFamily:MONO, minWidth:18, textAlign:"center" }}>{item.faults}</span>
                    <button onClick={() => setFaults(item.faults + 1)} aria-label="Arıza artır"
                      style={{ background:"none", border:"none", color:T.R, fontSize:18, cursor:"pointer" }}>+</button>
                  </div>
                </div>
                <button onClick={() => { if (confirm(`"${item.name}" envanterden silinsin mi?`)) { onDelete(item.id); } }}
                  style={{ ...outlineBtn, flex:"none", width:"100%" }}>Ürünü Sil</button>
              </div>
            ) : (
              <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                <input type="number" inputMode="numeric" min="1" value={amount} onChange={e => setAmount(e.target.value)} autoFocus
                  style={{ width:64, background:T.bg0, border:`1px solid ${T.R}55`, outline:"none", borderRadius:8, padding:"9px 10px", fontSize:16, color:T.R, fontFamily:MONO, textAlign:"center" }}/>
                <span style={{ fontSize:13, color:T.L3, fontFamily:SF }}>adet {mode === "add" ? "ekle" : "düş"}</span>
                <button onClick={applyStock}
                  style={{ flex:1, background:T.R, border:"none", borderRadius:10, padding:"11px 0", fontSize:14, fontWeight:600, color:"#fff", cursor:"pointer", fontFamily:SF }}>
                  Onayla
                </button>
                <button onClick={() => { setMode(null); setAmount("1"); }}
                  style={{ background:"none", border:"none", color:T.L3, fontSize:13, cursor:"pointer", fontFamily:SF }}>İptal</button>
              </div>
            )}
          </div>
        )}
      </div>
    </Sheet>
  );
}

function InventoryView({ user }) {
  const [items, setItems] = usePersisted("inventory", INVENTORY_INIT);
  const [q, setQ] = useState("");
  const [selCat, setSelCat] = useState("Tümü");
  const [detailId, setDetailId] = useState(null);
  const [adding, setAdding] = useState(false);

  const addItem = item => { setItems(p => [item, ...p]); setAdding(false); };
  const updateItem = updated => setItems(p => p.map(i => (i.id === updated.id ? updated : i)));
  const deleteItem = id => { setItems(p => p.filter(i => i.id !== id)); setDetailId(null); };

  /* Seçili ürünü id ile takip ediyoruz; kopya tutulunca panel güncellemeden
     sonra eski veriyi gösteriyordu. */
  const detail = items.find(i => i.id === detailId) || null;

  const allCats = ["Tümü", ...new Set(items.map(i => i.cat))];
  const needle = q.trim().toLocaleLowerCase("tr");
  const filtered = items.filter(i =>
    (!needle || i.name.toLocaleLowerCase("tr").includes(needle) || i.cat.toLocaleLowerCase("tr").includes(needle)) &&
    (selCat === "Tümü" || i.cat === selCat)
  );
  const grouped = [...new Set(filtered.map(i => i.cat))].map(c => ({ cat:c, items:filtered.filter(i => i.cat === c) }));

  /* Filtrelenen kategori silinirse "Tümü"ne dön */
  useEffect(() => {
    if (selCat !== "Tümü" && !items.some(i => i.cat === selCat)) setSelCat("Tümü");
  }, [items, selCat]);

  return (
    <div style={{ paddingBottom:100, fontFamily:SF }}>
      <PageTitle right={
        <button onClick={() => setAdding(true)}
          style={{ background:"none", border:"none", color:T.Y, fontSize:15, cursor:"pointer", fontFamily:SF, paddingBottom:4 }}>+ Ekle</button>
      }>Envanter</PageTitle>

      {/* Arama */}
      <div style={{ padding:"0 16px 10px" }}>
        <div style={{ background:T.bg2, borderRadius:10, display:"flex", alignItems:"center", padding:"8px 12px", gap:8 }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="5" stroke={T.L4} strokeWidth="1.4"/><path d="M10 10l3 3" stroke={T.L4} strokeWidth="1.4" strokeLinecap="round"/></svg>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Ürün ara…" type="search"
            style={{ flex:1, background:"none", border:"none", outline:"none", fontSize:15, color:T.L1, fontFamily:SF }}/>
          {q && <button onClick={() => setQ("")} aria-label="Aramayı temizle"
            style={{ background:"none", border:"none", color:T.L4, cursor:"pointer", fontSize:16, padding:0 }}>✕</button>}
        </div>
      </div>

      {/* Kategori seçici — yatay kaydırma sekme değiştirmesin */}
      <div data-noswipe="1" style={{ padding:"0 16px 14px", display:"flex", gap:8, overflowX:"auto", scrollbarWidth:"none" }}>
        {allCats.map(c => (
          <button key={c} onClick={() => setSelCat(c)}
            style={{ flexShrink:0, background:selCat === c ? T.Yd : T.bg2, border:`1px solid ${selCat === c ? T.Y + "44" : "transparent"}`, borderRadius:20, padding:"6px 14px", fontSize:13, color:selCat === c ? T.Y : T.L2, cursor:"pointer", fontFamily:SF, whiteSpace:"nowrap" }}>
            {c}
          </button>
        ))}
      </div>

      {/* Özet */}
      <div style={{ margin:"0 16px 14px", background:T.bg1, borderRadius:12, padding:"12px 16px", display:"flex" }}>
        {[["Ürün çeşidi", items.length, T.L1],
          ["Dışarıda", items.reduce((s, i) => s + i.out, 0), T.Y],
          ["Arızalı", items.reduce((s, i) => s + i.faults, 0), T.R]].map(([label, value, color], idx) => (
          <div key={label} style={{ flex:1, textAlign:"center", borderLeft:idx > 0 ? `1px solid ${T.sep}` : "none" }}>
            <p style={{ margin:0, fontSize:22, fontWeight:700, color, fontFamily:MONO }}>{value}</p>
            <p style={{ margin:"3px 0 0", fontSize:10, color:T.L4, fontFamily:SF }}>{label}</p>
          </div>
        ))}
      </div>

      {/* Liste */}
      {grouped.map(({ cat, items:gitems }) => (
        <div key={cat}>
          <SectionHeader>{cat}</SectionHeader>
          <div style={{ padding:"0 16px" }}>
            <div style={{ borderRadius:12, overflow:"hidden" }}>
              {gitems.map((item, i, arr) => {
                const avail = Math.max(0, item.total - item.out);
                const cases = Math.ceil(item.total / item.perCase) || 0;
                const availCases = Math.floor(avail / item.perCase);
                return (
                  <Cell key={item.id} first={i === 0} last={i === arr.length - 1} onClick={() => setDetailId(item.id)}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:7 }}>
                        <p style={{ margin:0, fontSize:15, color:T.L1, fontWeight:500, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{item.name}</p>
                        {item.faults > 0 && <span style={{ fontSize:10, color:T.R, background:T.Rd, padding:"1px 5px", borderRadius:5, flexShrink:0 }}>⚠{item.faults}</span>}
                      </div>
                      <p style={{ margin:"3px 0 0", fontSize:11, color:T.L4, fontFamily:SF, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                        {item.perCase}/case
                        {item.accessories.length > 0 && <span style={{ marginLeft:6 }}>· {item.accessories.map(a => a.name).join(", ")}</span>}
                      </p>
                    </div>
                    <div style={{ textAlign:"right", flexShrink:0, marginRight:4 }}>
                      <p style={{ margin:0, fontSize:16, fontWeight:700, color:avail > 0 ? T.L1 : T.R, fontFamily:MONO }}>
                        {avail}<span style={{ fontSize:11, color:T.L4 }}>/{item.total}</span>
                      </p>
                      <p style={{ margin:"2px 0 0", fontSize:11, color:T.Y, fontFamily:SF }}>{availCases}/{cases} case</p>
                    </div>
                    <Chevron/>
                  </Cell>
                );
              })}
            </div>
          </div>
        </div>
      ))}

      {filtered.length === 0 && <Empty>Ürün bulunamadı</Empty>}

      {adding && (
        <AddProductSheet
          cats={[...new Set([...DEFAULT_CATS, ...items.map(i => i.cat)])]}
          onSave={addItem} onClose={() => setAdding(false)}/>
      )}
      {detail && (
        <ProductDetail item={detail} user={user}
          onClose={() => setDetailId(null)} onUpdate={updateItem} onDelete={deleteItem}/>
      )}
    </div>
  );
}

const ADMIN_ITEMS = [
  { icon:"👤", label:"Kullanıcı Yönetimi", sub:"Ekle · Çıkar · PIN sıfırla" },
  { icon:"🏨", label:"Rider Şablonları",   sub:"Robinson · Seno · Fortezza…" },
  { icon:"📅", label:"Etkinlik Oluştur",   sub:"Takvime ekle, ekip ata" },
  { icon:"🚛", label:"Araç Yönetimi",      sub:"Hangi araç hangi etkinliğe" },
  { icon:"📊", label:"İstatistikler",      sub:"Arıza · Müşteri · Ekip analizi" },
];

function AdminView() {
  const [toast, setToast] = useState("");

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 1800);
    return () => clearTimeout(t);
  }, [toast]);

  return (
    <div style={{ paddingBottom:100, fontFamily:SF }}>
      <PageTitle>Yönetici</PageTitle>
      <div style={{ padding:"0 16px" }}>
        <div style={{ borderRadius:12, overflow:"hidden" }}>
          {ADMIN_ITEMS.map((it, i, arr) => (
            <Cell key={it.label} first={i === 0} last={i === arr.length - 1} onClick={() => setToast(it.label)}>
              <div style={{ width:34, height:34, borderRadius:9, background:T.bg2, display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, flexShrink:0 }}>{it.icon}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <p style={{ margin:0, fontSize:15, color:T.L1 }}>{it.label}</p>
                <p style={{ margin:"2px 0 0", fontSize:12, color:T.L3 }}>{it.sub}</p>
              </div>
              <span style={{ fontSize:10, color:T.L4, border:`1px solid ${T.L4}`, borderRadius:5, padding:"1px 6px", flexShrink:0 }}>yakında</span>
              <Chevron/>
            </Cell>
          ))}
        </div>
        <p style={{ margin:"14px 4px 0", fontSize:12, color:T.L4 }}>
          Bu ekranlar henüz tasarımda. Takvim, görev ve envanter akışları çalışır durumda.
        </p>
      </div>

      {toast && (
        <div style={{ position:"fixed", left:"50%", bottom:110, transform:"translateX(-50%)", background:T.bg2, color:T.L1, fontSize:13, padding:"10px 16px", borderRadius:20, zIndex:150, fontFamily:SF, whiteSpace:"nowrap" }}>
          {toast} · yakında
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────
   TAB BAR
───────────────────────────────────────── */
const TABS_CREW   = [{ id:"cal", label:"Takvim" }, { id:"tasks", label:"Görevler" }, { id:"inv", label:"Envanter" }];
const TABS_PATRON = [...TABS_CREW, { id:"admin", label:"Yönetici" }];

const TAB_ICON = {
  cal:   <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="14" rx="3" stroke="currentColor" strokeWidth="1.4"/><path d="M2 8h16M6 2v4M14 2v4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  tasks: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 10l3 3 7-7" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/><rect x="2" y="2" width="16" height="16" rx="3" stroke="currentColor" strokeWidth="1.4"/></svg>,
  inv:   <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.4"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.4"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.4"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.4"/></svg>,
  admin: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" strokeWidth="1.4"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
};

/* ─────────────────────────────────────────
   ROOT
───────────────────────────────────────── */
function App() {
  /* Eskiden başlangıç kullanıcısı sabit "Ömer" idi; giriş ekranı hiç
     görünmüyordu. Artık oturum yoksa girişle başlıyor. */
  const [user, setUser] = usePersisted("session", null);
  const [patron, setPatron] = useState(false);
  const [tab, setTab] = useState("cal");
  const [eventId, setEventId] = useState(null);
  const [evState, setEvState] = usePersisted("eventState", {});

  const touch = useRef(null);
  const dragRef = useRef(null);

  const tabs = user?.role === "patron" ? TABS_PATRON : TABS_CREW;
  const event = eventId != null ? EVENTS.find(e => e.id === eventId) : null;

  /* Kullanıcı rol değiştirince (ör. çıkış → ekip girişi) geçersiz sekmede kalmasın */
  useEffect(() => {
    if (user && !tabs.some(t => t.id === tab)) setTab("cal");
  }, [user, tabs, tab]);

  const setEventState = next => setEvState(p => ({ ...p, [eventId]:next }));

  /* ── Kaydırarak sekme değiştirme ──
     Düzeltmeler: clientX === 0 iken jest yok sayılıyordu (0 falsy);
     dikey kaydırma yatay sürükleme tetikliyordu; panel/karusel
     üzerindeki kaydırmalar sekmeyi değiştiriyordu. */
  const swipeStart = e => {
    if (event || e.touches.length !== 1 || e.target.closest?.("[data-noswipe]")) { touch.current = null; return; }
    touch.current = { x:e.touches[0].clientX, y:e.touches[0].clientY, axis:null };
  };

  const swipeMove = e => {
    const t = touch.current;
    if (!t || !dragRef.current) return;
    const dx = e.touches[0].clientX - t.x;
    const dy = e.touches[0].clientY - t.y;

    if (!t.axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      t.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
    if (t.axis === "y") return;

    const idx = tabs.findIndex(x => x.id === tab);
    if ((dx > 0 && idx === 0) || (dx < 0 && idx === tabs.length - 1)) return;
    dragRef.current.style.transform = `translateX(${dx * 0.32}px)`;
  };

  const swipeEnd = e => {
    const t = touch.current;
    touch.current = null;
    if (dragRef.current) {
      dragRef.current.style.transition = "transform .2s ease";
      dragRef.current.style.transform = "translateX(0)";
      setTimeout(() => { if (dragRef.current) dragRef.current.style.transition = ""; }, 220);
    }
    if (!t || t.axis !== "x") return;

    const dx = e.changedTouches[0].clientX - t.x;
    if (Math.abs(dx) <= 42) return;
    const idx = tabs.findIndex(x => x.id === tab);
    if (dx < 0 && idx < tabs.length - 1) setTab(tabs[idx + 1].id);
    if (dx > 0 && idx > 0)               setTab(tabs[idx - 1].id);
  };

  const logout = () => {
    if (!confirm("Çıkış yapılsın mı?")) return;
    setUser(null); setPatron(false); setTab("cal"); setEventId(null);
  };

  /* Giriş ekranları */
  if (!user) {
    return patron
      ? <PatronLogin onLogin={u => { setUser(u); setPatron(false); }} onBack={() => setPatron(false)}/>
      : <CrewLogin onLogin={setUser} onPatron={() => setPatron(true)}/>;
  }

  return (
    <div style={{ minHeight:"100dvh", background:T.bg0, color:T.L1, maxWidth:430, margin:"0 auto", position:"relative", overflowX:"hidden" }}
      onTouchStart={swipeStart} onTouchMove={swipeMove} onTouchEnd={swipeEnd} onTouchCancel={swipeEnd}>

      {/* Üst çubuk */}
      <div style={{ background:"rgba(0,0,0,0.8)", backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)", borderBottom:`1px solid ${T.sep}`, padding:"10px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", position:"sticky", top:0, zIndex:100 }}>
        <Logo size={24}/>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span style={{ fontSize:13, color:T.L2, fontFamily:SF }}>
            {user.name}{user.role === "patron" && <span style={{ color:T.Y }}> · yönetici</span>}
          </span>
          <button onClick={logout} aria-label="Çıkış"
            style={{ background:T.bg2, border:"none", color:T.L3, borderRadius:6, width:28, height:28, fontSize:13, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
            ⏻
          </button>
        </div>
      </div>

      {/* İçerik */}
      <div ref={dragRef}>
        {event ? (
          <EventDetail
            ev={event} user={user}
            state={evState[event.id] || { checked:[], notes:[] }}
            onChange={setEventState}
            onBack={() => setEventId(null)}/>
        ) : (
          <div key={tab} style={{ animation:"fadeUp .2s ease" }}>
            {tab === "cal"   && <CalendarView user={user} onPick={ev => setEventId(ev.id)}/>}
            {tab === "tasks" && <TasksView user={user}/>}
            {tab === "inv"   && <InventoryView user={user}/>}
            {tab === "admin" && user.role === "patron" && <AdminView/>}
          </div>
        )}
      </div>

      {/* Sekme çubuğu */}
      {!event && (
        <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:430, background:"rgba(0,0,0,0.85)", backdropFilter:"blur(24px)", WebkitBackdropFilter:"blur(24px)", borderTop:`1px solid ${T.sep}`, display:"flex", paddingBottom:"env(safe-area-inset-bottom,16px)", zIndex:90 }}>
          {tabs.map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)} aria-current={active ? "page" : undefined}
                style={{ flex:1, background:"none", border:"none", display:"flex", flexDirection:"column", alignItems:"center", gap:4, padding:"10px 0 2px", cursor:"pointer", color:active ? T.Y : "rgba(255,255,255,0.42)", transition:"color .15s", WebkitTapHighlightColor:"transparent" }}>
                {TAB_ICON[t.id]}
                <span style={{ fontSize:10, fontWeight:active ? 600 : 400, letterSpacing:0.2, fontFamily:SF }}>{t.label}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
